name: Dependency Cache Demo

on:
  workflow_dispatch:

jobs:
  cache-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: prime-cache-caeb989
        id: cache-step
        uses: actions/cache@v4
        with:
          path: ~/.cache/demo-cache
          key: cache-caeb989
      
      - name: Show cache hit/miss
        run: echo "Cache hit: ${{ steps.cache-step.outputs.cache-hit }}"

      - name: Populate cache example
        run: |
          mkdir -p ~/.cache/demo-cache
          echo "demo-data-$(date)" > ~/.cache/demo-cache/example.txt
          cat ~/.cache/demo-cache/example.txt
